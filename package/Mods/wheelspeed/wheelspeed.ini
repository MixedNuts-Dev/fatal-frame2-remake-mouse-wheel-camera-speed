[General]
; 1 = enabled / 0 = disabled
; 1 = 有効 / 0 = 無効（無効にするとゲームは完全に素の状態で動きます）
Enabled=1

; 1 = write wheelspeed.log in this folder / 0 = no log
; 1 = このフォルダに wheelspeed.log を出力 / 0 = 出力しない
Log=1

[Speed]
; How much faster the Camera Obscura zooms and focuses per mouse wheel notch.
; 10 = ten times the game's default. 1 = the game's default.
; Decimals are allowed (e.g. 7.5). Range: 0.1 - 100.
; The gamepad uses the same values, so it gets faster too.
;
; マウスホイール 1 ノッチあたりの、射影機のズームとピントの速さ。
; 10 = ゲーム標準の 10 倍。1 = ゲーム標準のまま。
; 小数も使えます（例: 7.5）。範囲は 0.1 ～ 100。
; パッドも同じ値を使うため、パッドの操作も同じ倍率で速くなります。
Multiplier=10
